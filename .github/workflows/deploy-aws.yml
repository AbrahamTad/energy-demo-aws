name: Apply AWS (manual, reviewed plan only)
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful manual Plan AWS run ID (first attempt, less than 24h old)
        required: true
        type: string
      commit_sha:
        description: Exact reviewed 40-character commit SHA, still current main
        required: true
        type: string
      plan_sha256:
        description: Exact reviewed 64-character saved-plan SHA-256
        required: true
        type: string
      confirmation:
        description: Type APPLY ENERGYDEMO PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: energy-demo-real-aws
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''
  CHECKPOINT_DISABLE: '1'
  TF_IN_AUTOMATION: 'true'
  TF_WORKSPACE: default
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_budget_email: ${{ secrets.AWS_BUDGET_EMAIL }}
  # Defaults preserve the existing deployment. Enabling requires reviewed bootstrap preparation.
  TF_VAR_enable_admin: ${{ vars.AWS_ENABLE_ADMIN || 'false' }}
  TF_VAR_admin_cognito_client_id: ${{ vars.AWS_ADMIN_COGNITO_CLIENT_ID }}
  TF_VAR_admin_email_sender: ${{ vars.AWS_ADMIN_EMAIL_SENDER }}
  TF_VAR_admin_email_recipients: ${{ vars.AWS_ADMIN_EMAIL_RECIPIENTS || '[]' }}
  AWS_API_ID: ${{ vars.AWS_API_ID }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_CLOUDFRONT_OAC_ID: ${{ vars.AWS_CLOUDFRONT_OAC_ID }}
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}
  REVIEWED_COMMIT: ${{ inputs.commit_sha }}
  PLAN_SHA256: ${{ inputs.plan_sha256 }}
  APPLY_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  apply:
    if: github.repository == 'AbrahamTad/energy-demo-aws' && github.ref == 'refs/heads/main'
    environment: aws-production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      # Durable single-use plan ledger; no AWS permission expansion.
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify explicit owner confirmation and download exact trusted Plan artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aws/check_environment.py prepare
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Verify saved plan with provider schema only (no AWS credentials)
        run: |
          terraform -chdir=infrastructure/terraform-aws init -backend=false -input=false -lockfile=readonly
          cp .local/reviewed-plan/reviewed.tfplan infrastructure/terraform-aws/reviewed.tfplan
          python3 scripts/aws/check_plan.py
      - name: Consume plan once, before deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aws/check_environment.py consume
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/energy-demo-bootstrap/github-deploy
          aws-region: eu-north-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-session-name: energy-demo-deploy-${{ github.run_id }}
      - run: python3 scripts/aws/init_backend.py
      - name: Recheck reservation, main, expiry, configuration and saved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/aws/check_environment.py verify
          cmp .local/reviewed-plan/reviewed.tfplan infrastructure/terraform-aws/reviewed.tfplan
          python3 scripts/aws/check_plan.py
      - name: Apply only the explicitly confirmed saved plan
        run: terraform -chdir=infrastructure/terraform-aws apply -input=false -lock-timeout=120s reviewed.tfplan
      - name: Upload reviewed static frontend and smoke-test public site
        run: python3 scripts/aws/publish_frontend.py
