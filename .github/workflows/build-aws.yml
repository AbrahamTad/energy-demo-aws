name: Build AWS
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      CHECKPOINT_DISABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test sample Lambda and deployment safeguards
        run: python -m unittest discover -s tests/aws -v
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build -- --mode aws
        working-directory: frontend
      - name: Package this commit
        run: python scripts/aws/build_artifact.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Validate AWS configurations without credentials or backend access
        run: |
          terraform fmt -check -recursive infrastructure/terraform-aws infrastructure/terraform-aws-bootstrap
          for directory in infrastructure/terraform-aws infrastructure/terraform-aws-bootstrap; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
            terraform -chdir="$directory" test -no-color
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-build-${{ github.sha }}
          path: artifacts/aws/
          retention-days: 2
          if-no-files-found: error
